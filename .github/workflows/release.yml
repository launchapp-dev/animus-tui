name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

env:
  # GitHub Actions runner Node 20 -> Node 24 deprecation (effective 2026-06-02).
  # Forces JS-based actions onto Node 24 ahead of the cutover.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --release --target ${{ matrix.target }} --bin animus-tui
      - name: package
        run: |
          mkdir -p dist
          BIN=animus-tui
          ARCHIVE="${BIN}-${{ matrix.target }}.tar.gz"
          tar -C target/${{ matrix.target }}/release -czf "dist/${ARCHIVE}" "${BIN}"
          ( cd dist && shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256" )
      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0
      - name: Sign archive with cosign (keyless)
        run: |
          set -euo pipefail
          BIN=animus-tui
          ARCHIVE="${BIN}-${{ matrix.target }}.tar.gz"
          cd dist
          cosign sign-blob \
            --yes \
            --bundle "${ARCHIVE}.bundle" \
            "${ARCHIVE}"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
